<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動集章闖關趣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; }
        /* 擬真印章落下的震撼彈跳動畫 */
        .stamp-animation { animation: stampPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes stampPop {
            0% { transform: scale(3) rotate(30deg); opacity: 0; filter: blur(4px); }
            70% { transform: scale(0.95) rotate(-18deg); opacity: 1; filter: blur(0); }
            100% { transform: scale(1) rotate(-12deg); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between selection:bg-indigo-100">

    <header class="bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-800 text-white pt-8 pb-7 px-6 rounded-b-[2rem] shadow-xl shadow-indigo-100 sticky top-0 z-10 backdrop-blur-md">
        <div class="max-w-md mx-auto">
            <span class="inline-block bg-white/20 backdrop-blur-xs text-amber-300 text-xs font-bold tracking-widest px-3 py-1 rounded-full mb-2 uppercase"><i class="fas fa-sparkles mr-1"></i> 2026 限定活動</span>
            <h1 id="event-title" class="text-2xl font-black tracking-wide leading-tight">🌟 加載中...</h1>
            <p class="text-indigo-200 text-xs mt-1 font-medium">出示手機畫面給工作人員，輸入密碼即可蓋章</p>
            
            <div class="mt-5 bg-indigo-950/40 rounded-2xl p-1.5 shadow-inner border border-white/10">
                <div class="relative w-full bg-slate-900/20 h-5 rounded-xl overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-amber-400 to-orange-400 h-full rounded-xl transition-all duration-700 ease-out shadow-lg" style="width: 0%"></div>
                    <div id="progress-percent" class="absolute inset-0 flex items-center justify-center text-[11px] font-black text-indigo-950 tracking-wider">0%</div>
                </div>
            </div>
            <div class="flex justify-between items-center mt-2.5 px-1">
                <span id="progress-text" class="text-xs text-indigo-100 font-semibold">目前進度：0 / 0</span>
                <span class="text-[11px] text-amber-300 bg-amber-400/10 px-2 py-0.5 rounded-md font-bold border border-amber-400/20"><i class="fas fa-gift mr-1"></i>滿格換禮物</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto max-w-md px-5 py-6 flex-grow">
        <div id="prize-section" class="hidden mb-6 bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 text-white p-5 rounded-2xl shadow-lg shadow-orange-200 text-center border border-white/20">
            <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-2 shadow-inner">
                <i class="fas fa-trophy text-2xl text-amber-200 animate-bounce"></i>
            </div>
            <h3 class="text-lg font-bold tracking-wide">恭喜！解鎖全部關卡</h3>
            <p class="text-xs mt-1 text-orange-50 font-medium">請將此畫面出示給服務台人員，即可兌換精美贈品！</p>
        </div>

        <div id="checkpoint-grid" class="grid grid-cols-2 gap-4">
            </div>
    </main>

    <footer class="text-center py-5 text-[11px] text-slate-400 border-t border-slate-100 bg-white/80 backdrop-blur-md">
        <button onclick="resetGame()" class="text-slate-400 hover:text-red-500 transition-colors font-medium mb-2.5 inline-flex items-center gap-1 bg-slate-100 hover:bg-red-50 px-3 py-1 rounded-full text-[10px]"><i class="fas fa-undo-alt text-[9px]"></i> 重置所有集章進度</button>
        <p class="tracking-wider">© 2026 DIGITAL STAMP SYSTEM · ALL RIGHTS RESERVED</p>
    </footer>

    <div id="stamp-modal" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-md flex items-center justify-center z-50 p-5 transition-all duration-300">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-xs p-6 relative border border-slate-100 transform scale-100 transition-transform">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors"><i class="fas fa-times"></i></button>
            
            <div class="text-center">
                <div id="modal-icon" class="w-20 h-20 bg-indigo-50 rounded-2xl text-3xl text-indigo-600 mb-4 flex items-center justify-center mx-auto shadow-inner border border-indigo-100/50"></div>
                
                <h3 id="modal-title" class="text-lg font-bold text-slate-800 tracking-wide">關卡名稱</h3>
                <p id="modal-desc" class="text-slate-500 text-xs mt-2 leading-relaxed px-2">任務敘述...</p>
                
                <div id="modal-action-zone" class="mt-6 pt-4 border-t border-slate-100">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 🛠️ 自訂配置區 ====================
        const CONFIG = {
            title: "🚀 未來科技島：數位密碼集章戰",
            checkpoints: [
                { id: "cp1", name: "關卡 01 · 服務台", desc: "抵達主辦服務台，向人員確認報到狀況即可蓋章。", code: "1111", img: "", icon: "fa-map-marker-alt" },
                { id: "cp2", name: "關卡 02 · AI 體驗", desc: "操作 local LLM 進行對話互動，達成指定任務。", code: "2222", img: "", icon: "fa-brain" },
                { id: "cp3", name: "關卡 03 · 創客基地", desc: "參觀微型電磁軌道或自動化硬件展示，點讚專頁。", code: "3333", img: "", icon: "fa-bolt" },
                { id: "cp4", name: "關卡 04 · 拍照牆", desc: "在會場主題背板前方拍照，並加上雜湊標籤分享。", code: "4444", img: "", icon: "fa-hashtag" }
            ]
        };
        // ======================================================

        let userProgress = JSON.parse(localStorage.getItem('premium_progress')) || {};
        let currentActiveId = null;

        function init() {
            document.getElementById('event-title').innerText = CONFIG.title;
            renderGrid();
            updateProgress();
        }

        function renderGrid() {
            const grid = document.getElementById('checkpoint-grid');
            grid.innerHTML = '';

            CONFIG.checkpoints.forEach((cp) => {
                const isStamped = userProgress[cp.id] === true;
                const card = document.createElement('div');
                
                // 卡片基礎 UI：加上平滑過渡、微陰影與點擊縮小回饋
                card.className = `group bg-white p-5 rounded-2xl border text-center relative overflow-hidden transition-all duration-300 active:scale-95 cursor-pointer flex flex-col items-center justify-center min-h-[145px] ${
                    isStamped 
                    ? 'border-emerald-200 bg-gradient-to-b from-emerald-50/40 to-emerald-50/10 shadow-inner' 
                    : 'border-slate-200/70 hover:border-indigo-200 shadow-xs hover:shadow-md'
                }`;
                card.onclick = () => openModal(cp);

                // 處理圖示與圖片
                let mediaHtml = cp.img 
                    ? `<img src="${cp.img}" class="w-14 h-14 object-contain mb-3 transition-all ${isStamped ? 'scale-100' : 'grayscale opacity-40 group-hover:opacity-60'}">` 
                    : `<div class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl mb-3 transition-all ${isStamped ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400 group-hover:bg-indigo-50 group-hover:text-indigo-500'}"><i class="fas ${cp.icon}"></i></div>`;

                if (isStamped) {
                    card.innerHTML = `
                        ${mediaHtml}
                        <span class="font-bold text-slate-700 text-xs tracking-wide">${cp.name}</span>
                        <div class="absolute inset-0 flex items-center justify-center bg-emerald-500/5 pointer-events-none">
                            <div class="stamp-animation w-22 h-22 border-4 border-double border-red-500/80 text-red-500/80 rounded-full flex flex-col items-center justify-center font-black transform -rotate-12 bg-white/60 backdrop-blur-[1px] shadow-xs">
                                <span class="text-[8px] tracking-widest scale-90 opacity-75">PASSED</span>
                                <span class="text-sm tracking-wider border-y border-red-500/80 my-0.5 px-1.5 font-black">已蓋章</span>
                                <span class="text-[7px] tracking-tighter scale-75 opacity-75">SUCCESS</span>
                            </div>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        ${mediaHtml}
                        <span class="font-semibold text-slate-600 text-xs tracking-wide group-hover:text-indigo-600 transition-colors">${cp.name}</span>
                        <div class="mt-2 text-[10px] text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md font-medium"><i class="fas fa-lock text-[8px] mr-1"></i>尚未解鎖</div>
                    `;
                }
                grid.appendChild(card);
            });
        }

        function updateProgress() {
            const total = CONFIG.checkpoints.length;
            const completed = CONFIG.checkpoints.filter(cp => userProgress[cp.id] === true).length;
            const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-percent').innerText = `${percentage}%`;
            document.getElementById('progress-text').innerText = `目前進度：${completed} / ${total}`;

            const prizeSection = document.getElementById('prize-section');
            if (completed === total && total > 0) {
                prizeSection.classList.remove('hidden');
            } else {
                prizeSection.classList.add('hidden');
            }
        }

        function openModal(cp) {
            currentActiveId = cp.id;
            document.getElementById('modal-title').innerText = cp.name;
            document.getElementById('modal-desc').innerText = cp.desc;
            
            let mediaHtml = cp.img ? `<img src="${cp.img}" class="w-16 h-16 object-contain">` : `<i class="fas ${cp.icon}"></i>`;
            document.getElementById('modal-icon').innerHTML = mediaHtml;
            
            const actionZone = document.getElementById('modal-action-zone');
            const isStamped = userProgress[cp.id] === true;

            if (isStamped) {
                actionZone.innerHTML = `
                    <div class="text-emerald-600 font-bold bg-emerald-50 border border-emerald-200 py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-inner">
                        <i class="fas fa-check-circle text-sm"></i> 此任務已順利過關！
                    </div>`;
            } else {
                actionZone.innerHTML = `
                    <label class="block text-[11px] text-slate-400 mb-2 text-left font-semibold tracking-wider uppercase">工作人員認證密碼：</label>
                    <input type="password" id="staff-code" inputmode="numeric" pattern="[0-8]*" placeholder="請輸入密碼" class="w-full border border-slate-200 bg-slate-50 rounded-xl px-3 py-2.5 text-center tracking-widest text-xl font-bold focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all mb-3 shadow-inner" maxlength="6">
                    <button onclick="submitStamp()" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white font-bold text-sm py-3 rounded-xl transition-all shadow-md shadow-indigo-100 active:scale-98">
                        確認蓋章驗證 <i class="fas fa-stamp ml-1 text-xs"></i>
                    </button>
                `;
            }

            document.getElementById('stamp-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('stamp-modal').classList.add('hidden');
            currentActiveId = null;
        }

        function submitStamp() {
            const codeInput = document.getElementById('staff-code').value;
            const targetCp = CONFIG.checkpoints.find(cp => cp.id === currentActiveId);

            if (targetCp && codeInput === targetCp.code) {
                userProgress[currentActiveId] = true;
                localStorage.setItem('premium_progress', JSON.stringify(userProgress));
                
                renderGrid();
                updateProgress();
                closeModal();
                
                if (navigator.vibrate) navigator.vibrate([80, 50, 80]); // 改章完成的手機震動回饋
            } else {
                alert('❌ 密碼輸入錯誤，請重新確認！');
            }
        }

        function resetGame() {
            if (confirm('確定要清除所有闖關章，重新開始嗎？')) {
                userProgress = {};
                localStorage.removeItem('premium_progress');
                init();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
