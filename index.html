<!DOCTYPE html>
<html class="light" lang="zh-TW">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Stamps | Event Scavenger Hunt</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-container": "#fefcff",
                    "on-tertiary": "#ffffff",
                    "on-background": "#191c1d",
                    "tertiary-container": "#1b1b1b",
                    "surface-container-low": "#f3f4f5",
                    "on-tertiary-container": "#848484",
                    "inverse-surface": "#2e3132",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "primary-fixed-dim": "#c6c6c6",
                    "on-secondary-fixed-variant": "#003ea8",
                    "secondary-fixed": "#dbe1ff",
                    "secondary": "#0051d5",
                    "secondary-fixed-dim": "#b4c5ff",
                    "surface-dim": "#d9dadb",
                    "on-primary-container": "#848484",
                    "on-primary-fixed-variant": "#474747",
                    "on-surface-variant": "#4c4546",
                    "on-secondary": "#ffffff",
                    "surface-container-highest": "#e1e3e4",
                    "outline": "#7e7576",
                    "on-error-container": "#93000a",
                    "on-primary": "#ffffff",
                    "inverse-primary": "#c6c6c6",
                    "surface-tint": "#5e5e5e",
                    "tertiary": "#000000",
                    "surface-container-high": "#e7e8e9",
                    "primary-container": "#1b1b1b",
                    "on-tertiary-fixed": "#1b1b1b",
                    "inverse-on-surface": "#f0f1f2",
                    "primary": "#000000",
                    "surface-variant": "#e1e3e4",
                    "secondary-container": "#316bf3",
                    "on-primary-fixed": "#1b1b1b",
                    "on-surface": "#191c1d",
                    "on-tertiary-fixed-variant": "#474747",
                    "background": "#f8f9fa",
                    "surface": "#f8f9fa",
                    "on-secondary-fixed": "#00174b",
                    "tertiary-fixed": "#e2e2e2",
                    "outline-variant": "#cfc4c5",
                    "surface-container": "#edeeef",
                    "tertiary-fixed-dim": "#c6c6c6",
                    "surface-bright": "#f8f9fa",
                    "error": "#ba1a1a",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed": "#e2e2e2"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-lg": "32px",
                    "gutter": "24px",
                    "margin-desktop": "64px",
                    "margin-mobile": "20px",
                    "stack-sm": "8px",
                    "container-max": "1200px",
                    "stack-xl": "64px",
                    "stack-md": "16px",
                    "unit": "8px"
            },
            "fontFamily": {
                    "label-sm": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "label-caps": ["Inter"],
                    "headline-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "display": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "label-sm": ["13px", {"lineHeight": "1", "letterSpacing": "0", "fontWeight": "500"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "1.4", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                    "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .stamp-active .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        .station-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stamped-state {
            border-color: #316bf3 !important;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md selection:bg-secondary-container selection:text-white">

    <div class="fixed top-0 left-0 h-[2px] bg-secondary-container z-[100] transition-all duration-500" id="global-progress" style="width: 0%;"></div>

    <header class="w-full top-0 sticky bg-surface dark:bg-background border-b border-outline-variant dark:border-outline z-50">
        <div class="flex justify-between items-center h-20 px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto">
            <div class="font-display text-[24px] md:text-display tracking-tighter text-primary dark:text-on-background cursor-pointer">
                Stamps
            </div>
            <nav class="hidden md:flex gap-gutter items-center h-full">
                <a class="cursor-pointer transition-opacity active:opacity-70 font-headline-md text-headline-md text-primary dark:text-on-background border-b-2 border-primary pb-1" href="#">My Collection</a>
                <button onclick="resetAllProgress()" class="text-xs text-error hover:underline ml-4">重置進度</button>
            </nav>
            <div class="flex items-center gap-stack-md">
                <span class="material-symbols-outlined text-[28px] cursor-pointer">account_circle</span>
            </div>
        </div>
    </header>

    <main class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop pt-stack-xl">
        <section class="mb-stack-xl max-w-2xl">
            <div id="event-tag" class="inline-block bg-tertiary-container text-white px-3 py-1 mb-stack-sm rounded-none font-label-caps text-label-caps uppercase tracking-widest text-[11px]">
                Event Scavenger Hunt
            </div>
            <h1 class="font-display text-display mb-stack-sm outline-none" id="event-title">
                Modern Tech Summit 2026
            </h1>
            <p id="event-desc" class="font-body-lg text-body-lg text-on-surface-variant">
                探索各大創新展區、收集數位印章，集滿後即可至大會服務台兌換專屬限定紀念禮。
            </p>
        </section>

        <section class="mb-stack-xl flex flex-col md:flex-row md:items-end justify-between gap-stack-md">
            <div>
                <p class="font-label-caps text-label-caps text-on-surface-variant mb-2">Collection Progress</p>
                <div class="flex items-baseline gap-2">
                    <span class="font-display text-display leading-none" id="stamps-count">0</span>
                    <span class="font-headline-md text-headline-md text-on-surface-variant" id="stations-total-text">/ 6 Stations Completed</span>
                </div>
            </div>
            <div class="w-full md:w-64 h-2 bg-surface-container-highest relative overflow-hidden">
                <div class="absolute left-0 top-0 h-full bg-secondary transition-all duration-500" id="progress-bar-inner" style="width: 0%;"></div>
            </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter" id="station-grid">
            </section>
    </main>

    <footer class="w-full mt-stack-xl border-t border-outline-variant dark:border-outline bg-surface-container-lowest dark:bg-tertiary-container">
        <div class="flex flex-col md:flex-row justify-between items-center py-stack-lg px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto gap-stack-md">
            <div class="font-label-caps text-label-caps uppercase tracking-widest text-primary text-[11px]">
                Stamps Collection System v1.1
            </div>
            <div class="font-label-sm text-label-sm text-on-surface-variant">
                © 2026 Event Craft. All rights reserved.
            </div>
        </div>
    </footer>

    <div id="stamp-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center z-[200] p-margin-mobile">
        <div class="bg-surface-container-lowest border border-outline-variant p-gutter max-w-sm w-full shadow-xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-on-surface-variant hover:text-primary">
                <span class="material-symbols-outlined">close</span>
            </button>
            <div class="text-left">
                <div class="text-xs font-label-caps text-secondary mb-1 uppercase tracking-wider">Station Verification</div>
                <h3 id="modal-station-name" class="font-headline-md text-headline-md mb-2 text-primary">關卡名稱</h3>
                <p id="modal-station-desc" class="font-body-md text-body-md text-on-surface-variant mb-4">關卡描述任務...</p>
                
                <div id="modal-action-area">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== ⚙️ 後台關卡與密碼配置中心 ====================
        const CONFIG = {
            tag: "Event Scavenger Hunt",
            title: "Modern Tech Summit 2026",
            desc: "探索各大創新展區、收集數位印章，集滿後即可至大會服務台兌換專屬限定紀念禮。",
            stations: [
                { id: "st1", name: "Station 01: Innovation Lab", desc: "Witness live demonstrations of the new neural processing units and interactive AI interfaces.", code: "1111", img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=600&q=80" },
                { id: "st2", name: "Station 02: Hardware Zone", desc: "Get hands-on experience with the next-generation tactile haptic devices and prototype builds.", code: "2222", img: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80" },
                { id: "st3", name: "Station 03: Design Thinking", desc: "Join a 10-minute rapid prototyping session led by the lead product designers.", code: "3333", img: "https://images.unsplash.com/photo-1531403009284-440f080d1e12?auto=format&fit=crop&w=600&q=80" },
                { id: "st4", name: "Station 04: Network Node", desc: "Learn about the decentralised storage protocols powering the event's data backbone.", code: "4444", img: "https://images.unsplash.com/photo-1544383835-bda2bc66a55d?auto=format&fit=crop&w=600&q=80" },
                { id: "st5", name: "Station 05: Sustainability Hub", desc: "Discover how we're reducing the carbon footprint of digital infrastructure by 40%.", code: "5555", img: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" },
                { id: "st6", name: "Station 06: Future Lounge", desc: "Engage in 1-on-1 networking with industry veterans in our dedicated quiet zone.", code: "6666", img: "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=600&q=80" }
            ]
        };

        // 讀取本地緩存進度
        let userProgress = JSON.parse(localStorage.getItem('summit_hunt_2026')) || {};
        let activeStationId = null;

        function initApp() {
            // 初始化文字
            document.getElementById('event-tag').innerText = CONFIG.tag;
            document.getElementById('event-title').innerText = CONFIG.title;
            document.getElementById('event-desc').innerText = CONFIG.desc;
            document.getElementById('stations-total-text').innerText = `/ ${CONFIG.stations.length} Stations Completed`;

            renderGrid();
            updateProgressCounters();
        }

        // 動態渲染關卡卡片
        function renderGrid() {
            const grid = document.getElementById('station-grid');
            grid.innerHTML = '';

            CONFIG.stations.forEach(st => {
                const isStamped = userProgress[st.id] === true;
                const card = document.createElement('div');
                
                card.className = `station-card group border ${isStamped ? 'stamped-state' : 'border-outline-variant'} bg-surface-container-lowest p-gutter flex flex-col h-full`;
                
                card.innerHTML = `
                    <div class="relative aspect-video mb-stack-md overflow-hidden bg-surface-container">
                        <img alt="${st.name}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 ${isStamped ? '' : 'grayscale'}" src="${st.img}"/>
                        <div class="absolute top-4 right-4 bg-secondary text-white w-10 h-10 flex items-center justify-center transition-opacity duration-300 ${isStamped ? 'opacity-100' : 'opacity-0'}">
                            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                        </div>
                    </div>
                    <div class="flex-grow">
                        <h3 class="font-headline-md text-headline-md mb-2">${st.name}</h3>
                        <p class="font-body-md text-body-md text-on-surface-variant mb-gutter">${st.desc}</p>
                    </div>
                    ${isStamped 
                        ? `<button class="w-full py-4 px-8 bg-surface-container-highest text-on-surface-variant font-label-caps text-label-caps tracking-widest flex items-center justify-center gap-2 cursor-default" disabled>STAMPED</button>`
                        : `<button class="w-full py-4 px-8 bg-primary text-white font-label-caps text-label-caps tracking-widest hover:bg-neutral-800 transition-colors active:scale-[0.98]" onclick="openStampModal('${st.id}')">STAMP HERE</button>`
                    }
                `;
                grid.appendChild(card);
            });
        }

        // 更新進度條
        function updateProgressCounters() {
            const total = CONFIG.stations.length;
            const completed = CONFIG.stations.filter(st => userProgress[st.id] === true).length;
            const percentage = total > 0 ? (completed / total) * 100 : 0;

            document.getElementById('stamps-count').innerText = completed;
            document.getElementById('progress-bar-inner').style.width = `${percentage}%`;
            document.getElementById('global-progress').style.width = `${percentage}%`;

            if (completed === total && total > 0) {
                setTimeout(() => {
                    alert('🎉 恭喜！您已成功集滿所有關卡印章。請至大會服務台向工作人員出示此畫面領取專屬精美獎品！');
                }, 400);
            }
        }

        // 彈出密碼視窗
        function openStampModal(stationId) {
            activeStationId = stationId;
            const st = CONFIG.stations.find(item => item.id === stationId);
            if (!st) return;

            document.getElementById('modal-station-name').innerText = st.name;
            document.getElementById('modal-station-desc').innerText = st.desc;
            
            const actionArea = document.getElementById('modal-action-area');
            actionArea.innerHTML = `
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-on-surface-variant mb-2">輸入現場工作人員認證碼：</label>
                    <input type="password" id="modal-passcode" inputmode="numeric" placeholder="••••" class="w-full border border-outline-variant bg-surface p-3 text-center tracking-widest font-bold text-lg focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary rounded-none">
                </div>
                <button onclick="verifyPasscode()" class="w-full py-3 bg-primary text-white font-label-caps text-label-caps tracking-widest hover:bg-neutral-800 transition-colors">
                    VERIFY & STAMP
                </button>
            `;

            document.getElementById('stamp-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('modal-passcode').focus(), 50);
        }

        function closeModal() {
            document.getElementById('stamp-modal').classList.add('hidden');
            activeStationId = null;
        }

        // 驗證密碼
        function verifyPasscode() {
            const inputCode = document.getElementById('modal-passcode').value;
            const st = CONFIG.stations.find(item => item.id === activeStationId);

            if (st && inputCode === st.code) {
                userProgress[activeStationId] = true;
                localStorage.setItem('summit_hunt_2026', JSON.stringify(userProgress));
                
                closeModal();
                renderGrid();
                updateProgressCounters();
            } else {
                alert('❌ 認證碼錯誤，請引導現場工作人員協助輸入！');
            }
        }

        // 管理員或測試用的進度清除功能
        function resetAllProgress() {
            if (confirm('確定要清空目前所有的集章紀錄嗎？此動作無法復原。')) {
                userProgress = {};
                localStorage.removeItem('summit_hunt_2026');
                renderGrid();
                updateProgressCounters();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
